<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="description" content="An offline learning arcade. Unlock concept levels, collect keys, and pass each map’s final assessment.">
<title>Keypath · Learning Arcade</title>
<style>
:root{color-scheme:light;--bg:#f2f5f0;--paper:#fff;--ink:#172922;--sub:#506459;--border:#d9e3da;--deep:#112d25;--lime:#c9f477;--mint:#def0e3;--shadow:0 5px 16px #243a2710;--accent:#1e654b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.52}
button,input{font:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid #237858;outline-offset:4px}
header{background:#fff;border-bottom:1px solid var(--border)}
.bar,main,.foot{width:min(1120px,calc(100% - 48px));margin-inline:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:1.18rem;font-weight:820;letter-spacing:-.045em}
.brand .badge{background:var(--deep);color:var(--lime);width:36px;height:36px;border-radius:10px}
.save{font-size:.77rem;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:7px;text-align:right}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:#508e65;flex:none}
.save.warn::before{background:#aa4d23}
main{margin-block:30px 54px;min-height:calc(100vh - 215px)}
.foot{border-top:1px solid var(--border);color:var(--sub);font-size:.78rem;padding:16px 0 24px;display:flex;justify-content:space-between;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:9px;color:var(--sub);font-size:.84rem;margin-bottom:18px}
.crumbs a{text-decoration:underline;text-underline-offset:4px}
.crumbs span:last-child{color:var(--ink);font-weight:660}
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--deep);color:white;border-radius:24px;padding:38px 40px;min-height:225px;display:flex;align-items:center;box-shadow:var(--shadow)}
.hero.large{min-height:300px}
.hero-content{position:relative;z-index:1;width:min(680px,69%)}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.07;letter-spacing:-.06em;margin:9px 0 13px}
.hero.large h1{font-size:clamp(2.5rem,5.8vw,4.3rem);max-width:14ch}
.hero p{color:#d4e8da;margin:0;max-width:52ch}
.hero .eyebrow{color:var(--lime)}
.hero .button,.hero .progress-block{margin-top:20px}
.hero-art{position:absolute;width:49%;height:100%;right:0;bottom:0;z-index:-1;color:#bde784;mask-image:linear-gradient(90deg,transparent,#000 22%)}
.eyebrow{font-size:.7rem;font-weight:820;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:31px 0 12px}
h2,h3{line-height:1.18;letter-spacing:-.035em;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.17rem}
p{margin:.5rem 0}
small,.muted{color:var(--sub)}
.small{font-size:.83rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow);padding:20px}
.course-card{display:flex;flex-direction:column;align-items:flex-start;min-height:195px;gap:9px;transition:border-color .15s,transform .15s}
.course-card:hover,.stage[href]:hover{border-color:#659e77;transform:translateY(-2px)}
.course-card .card-footer{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);color:var(--sub);font-size:.83rem;font-weight:700}
.course-card p{margin:0 0 5px}
.badge{width:46px;height:46px;border-radius:13px;background:var(--mint);color:#286044;display:inline-grid;place-items:center;flex:none}
.badge.violet{background:#ede8f9;color:#5a478a}
.badge.amber{background:#f9edd2;color:#795915}
.icon{width:21px;height:21px;display:inline-block;vertical-align:middle;flex:none}
.icon.sm{width:16px;height:16px}
.pill{display:inline-flex;gap:6px;align-items:center;min-height:24px;font-size:.73rem;font-weight:780;color:#2a5a40;background:#e7f3e6;border-radius:999px;padding:3px 9px}
.pill.locked{background:#edf0ed;color:#59675d}
.pill.active{background:var(--lime);color:var(--deep)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:41px;padding:9px 15px;border:1px solid transparent;border-radius:10px;background:var(--deep);color:#fff;font-weight:730;font-size:.88rem;text-align:center}
.button:hover:not(:disabled){background:#245443}
.button.light{background:var(--lime);color:var(--deep)}
.button.light:hover:not(:disabled){background:#dcfba9}
.button.outline{background:white;color:var(--deep);border-color:#b5c9ba}
.button.outline:hover:not(:disabled){background:#eaf3e9}
.button-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.map-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.map-card .map-copy{flex:1 1 340px}
.map-card .map-progress{flex:1 1 240px}
.progress-block{max-width:440px}
.progress-label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.82rem;font-weight:750;margin-bottom:5px}
progress{width:100%;display:block;height:8px;border:0;border-radius:999px;overflow:hidden;appearance:none;background:#dfe9e1}
progress::-webkit-progress-bar{background:#dfe9e1;border-radius:999px}
progress::-webkit-progress-value{background:#458a60;border-radius:999px}
progress::-moz-progress-bar{background:#458a60;border-radius:999px}
.hero progress,.hero progress::-webkit-progress-bar{background:#375548}
.hero progress::-webkit-progress-value{background:var(--lime)}
.hero progress::-moz-progress-bar{background:var(--lime)}
.empty{padding:34px;text-align:center}
.empty .badge{margin-bottom:12px}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:10px}
.stage{display:flex;gap:10px;align-items:center;min-height:88px;padding:11px 13px;background:#fff;border:1px solid var(--border);border-radius:13px;transition:border-color .15s,transform .15s}
.stage.locked{background:#edf1ec}
.stage.current{border-color:#7cb98e}
.stage .badge{width:35px;height:35px;border-radius:10px}
.stage.locked .badge{background:#e1e8e1;color:#52655a}
.stage-copy{flex:1;min-width:0}
.stage-copy strong{display:block;line-height:1.23;font-size:.91rem}
.stage-copy small{display:block;font-size:.7rem;margin-bottom:4px;font-weight:760;letter-spacing:.06em;text-transform:uppercase}
.stage>.icon{color:#497456}
.assessment-banner{margin-top:28px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.assessment-banner p{margin:3px 0 0}
.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.59fr);gap:17px;align-items:start}
.lesson-layout .card{padding:23px}
.lesson-copy{grid-column:1;grid-row:1}
.door-panel{grid-column:2;grid-row:1 / span 2}
.quiz-card{grid-column:1;grid-row:2}
.lesson-heading{margin:16px 0}
.lesson-heading h1,.assessment-heading h1{font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.1;letter-spacing:-.055em;margin:4px 0 8px}
.formula{padding:12px 14px;border-radius:9px;background:#ecf4ed;color:#173c2d;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.9rem;overflow-wrap:anywhere;margin:14px 0}
.example{border-left:3px solid #8fbd97;padding:2px 0 2px 12px}
.example p{margin:.25rem 0 0}
.lecture-figure{margin-top:12px}
.lecture-figure img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:7px;margin-top:8px}
.door-panel{padding:0!important;overflow:hidden;background:var(--deep);color:white}
.door-visual{min-height:238px;position:relative;isolation:isolate;display:grid;place-items:center;background:radial-gradient(ellipse at center,#294d3e,#122b23);overflow:hidden;color:#c5eab8}
.door-visual .hero-art{width:100%;mask-image:none;opacity:.58}
.door-emblem{position:absolute;width:70px;height:70px;left:9%;top:11%;opacity:.32}
.door{display:block;width:156px;height:195px}
.door-panel .door-copy{padding:17px 20px 21px}
.door-panel p{color:#d4e8da;margin-bottom:0}
.door-panel .pill{margin-bottom:9px}
.quiz-card .eyebrow{margin-bottom:7px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:1.1rem;font-weight:740;line-height:1.37;margin:0 0 10px;padding:0;max-width:100%}
.option{display:flex;gap:10px;align-items:flex-start;border:1px solid #cfdcd2;border-radius:10px;background:#fff;padding:10px 12px;margin:7px 0;color:var(--ink)}
.option:has(input:checked){background:#e8f6e8;border-color:#70a781}
.option:hover{border-color:#8ebc9b}
.option input{accent-color:#236448;margin:5px 0 0;flex:none;width:16px;height:16px}
.quiz-card .button-row,.assessment-card .button-row{margin-top:13px}
.feedback{border-left:4px solid #4f8b60;background:#e8f4e8;padding:10px 13px;border-radius:8px;margin-top:11px}
.feedback.wrong{border-color:#b86a35;background:#fff0e2}
.feedback p{margin:.25rem 0 0}
.assessment-heading{margin-bottom:15px}
.assessment-card,.results{max-width:760px}
.exam-nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.exam-nav button{background:#fff;color:var(--deep);border:1px solid #c3d4c7;border-radius:8px;min-width:37px;min-height:36px;font-weight:700}
.exam-nav button.done{background:#e2f2e3}
.exam-nav button[aria-current="step"]{background:var(--deep);color:#fff}
.score{display:flex;align-items:center;flex-wrap:wrap;gap:14px}
.score strong{font-size:2.6rem;letter-spacing:-.07em;line-height:1}
details{margin-top:8px;padding:10px 13px;border:1px solid var(--border);border-radius:8px}
summary{cursor:pointer;font-weight:700}
.review-answer{font-size:.88rem}
@media(max-width:770px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-content{width:77%}.hero-art{opacity:.65}.lesson-layout{grid-template-columns:1fr}.lesson-copy,.door-panel,.quiz-card{grid-column:1;grid-row:auto}.door-visual{min-height:175px}.door{height:145px}.door-emblem{left:17%}.map-card .map-copy{flex-basis:220px}}
@media(max-width:500px){.bar,main,.foot{width:calc(100% - 28px)}main{margin-top:19px}.hero,.hero.large{padding:25px 20px;min-height:205px;border-radius:16px}.hero-content{width:100%}.hero-art{opacity:.3;width:62%}.grid{grid-template-columns:1fr}.course-card{min-height:165px}.card,.lesson-layout .card{padding:16px}.foot{flex-direction:column;gap:2px}.save{font-size:.69rem}.map-card{align-items:flex-start}.map-card .map-copy{flex-basis:190px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="#library" aria-label="Keypath course library"><span id="brand-icon" class="badge"></span>Keypath</a><span id="save-status" class="save" role="status">Offline · Saved on this device</span></div></header>
<main id="app"></main>
<footer class="foot"><span>Keypath Learning Arcade</span><span>One key per concept · One assessment per map</span></footer>
<script>
const question = (prompt, options, answer, explanation) => ({prompt, options, answer, explanation});
const lesson = (id, title, glyph, pages, concept, formula, example, questions) =>
  ({id, title, glyph, pages, concept, formula, example, questions});
const q = question;
const l = lesson;
const foundations = [
  l('affine-classifier','Affine classifiers','line','2',
    'Logistic regression applies a sigmoid to an affine score. At a probability threshold of 0.5, the decision boundary is the set of inputs whose score equals zero.',
    'z = wᵀx + b  ·  p = σ(z)',
    'The lecture shows two classes in a two-feature plane that a straight line can separate.',
    [q('A model uses z = 2x₁ − x₂ − 4 and a probability threshold of 0.5. Where is its boundary?',
      ['x₂ = 2x₁ + 4','x₂ = 2x₁ − 4','x₂ = 2x₁ − 3.5','x₂ = 0.5'],1,
      'A probability of 0.5 corresponds to z = 0. Setting 2x₁ − x₂ − 4 = 0 gives x₂ = 2x₁ − 4.')]),
  l('xor-separation','Linear separability and XOR','xor','3',
    'A linearly separable data set has a single straight boundary that puts the classes on opposite sides. In XOR, each class occupies opposite corners, and the segments joining the same-class pairs intersect.',
    'XOR(x₁, x₂) = 1 if x₁ ≠ x₂',
    'The four binary inputs have labels 0, 1, 1, 0 at (0,0), (1,0), (0,1), (1,1), respectively.',
    [q('Class A occupies (−2,−2) and (2,2). Class B occupies (−2,2) and (2,−2). Can a single line strictly separate them?',
      ['Yes, a horizontal line','Yes, a vertical line','No, the class segments intersect','Yes, any diagonal line'],2,
      'Both same-class segments pass through (0,0). A linear separator would have to put that point on both sides.')]),
  l('neuron','The artificial neuron','network','4',
    'One neuron takes a weighted sum of its inputs, adds a bias, and applies an activation to produce a scalar. The bias shifts the preactivation independently of the input.',
    'a = Σᵢ wᵢxᵢ + b  ·  h = φ(a)',
    'The lecture diagram routes n weighted inputs and a bias into a sum, then applies φ to produce one output h.',
    [q('A neuron receives x = (3, −1), w = (2, 4), and b = −1. What is the preactivation?',
      ['1','3','5','9'],0,'Multiply matching coordinates and add the bias. The result is 6 − 4 − 1 = 1.')]),
  l('sigmoid','Sigmoid and probability','curve','5, 18',
    'Sigmoid is increasing and maps real-valued scores to probabilities strictly between 0 and 1. At large positive or negative scores it saturates, so small score changes have little effect on the probability.',
    'σ(z) = 1 / (1 + e⁻ᶻ)',
    'The lecture feeds the output logit z = 0.5 into sigmoid to obtain p ≈ 0.6225.',
    [q('A classifier has z = ln(3). What probability does sigmoid return?',
      ['0.25','0.50','0.67','0.75'],3,'Since e⁻ᶻ = 1/3, sigmoid is 1/(1 + 1/3) = 3/4.')]),
  l('tanh','The tanh activation','curve','5',
    'Tanh returns values in (−1, 1) and is centered at zero. It is odd, so a sign flip in the input flips the output sign. It saturates for inputs with large magnitude.',
    'tanh(0) = 0  ·  tanh(−a) = −tanh(a)',
    'The activation comparison plots tanh crossing the origin and flattening toward both endpoints.',
    [q('If tanh(s) = 0.6, what is tanh(−s)?',
      ['0.6','−0.6','0.4','0'],1,'Tanh is odd, so reversing the input sign changes 0.6 to −0.6.')]),
  l('relu','ReLU features','relu','5, 16',
    'ReLU keeps positive scores and maps nonpositive scores to zero. This creates piecewise-linear features and can switch a unit off for particular inputs.',
    'ReLU(a) = max(0, a)',
    'Both hidden scores in the worked forward pass are positive, so ReLU leaves (1, 0.5) unchanged.',
    [q('Apply ReLU elementwise to a = (−3, 0, 2). What is h?',
      ['(−3, 0, 2)','(3, 0, 2)','(0, 0, 2)','(0, 0, 1)'],2,
      'Each coordinate becomes the larger of itself and zero. Only the positive score of 2 survives.')]),
  l('affine-composition','Stacking affine layers','line','6',
    'Composing affine layers without a nonlinear activation gives a single affine map. Additional affine layers alone therefore cannot create an XOR boundary.',
    'W₂(W₁x + b₁) + b₂ = (W₂W₁)x + W₂b₁ + b₂',
    'The lecture expands two layers to Ax + d and uses this result to motivate nonlinear hidden activations.',
    [q('The first layer is 3x − 2 and the second is 4u + 1. What is the combined map?',
      ['12x − 7','7x − 1','12x − 1','12x + 9'],0,
      'Substitute the first layer into the second. This gives 4(3x − 2) + 1 = 12x − 7.')]),
  l('dense','Fully connected networks','network','7, 10',
    'In a dense layer, every output unit can use every unit from the previous layer. Width counts units in a layer. A hidden layer sits between the input and the output.',
    'Dense layer  ·  each input → each output',
    'The lecture shows three hidden layers with eight ReLU units each. The diagram displays three units per layer for readability.',
    [q('A dense hidden layer has 6 inputs and 4 units. How many weights connect these inputs to these units, excluding biases?',
      ['4','6','10','24'],3,'Each of the 4 units has 6 incoming weights, so there are 4 × 6 = 24.')]),
  l('representation','Representation','grid','8, 11, 43',
    'Representation asks whether some parameter setting in the architecture can express the target function. Constructing one working setting is enough to establish that the architecture can represent that function.',
    'Architecture + suitable parameters → expressible function',
    'The lecture builds a two-ReLU network with hand-chosen parameters that implements XOR.',
    [q('You exhibit weights that implement a specified threshold rule exactly. What have you established?',
      ['The model is well calibrated','The architecture can represent the rule','Gradient descent always finds those weights','The model generalizes to future data'],1,
      'A working parameter setting proves representability. Optimization and behavior on new data are separate questions.')]),
  l('optimization','Optimization','target','8, 25',
    'Optimization concerns finding parameter values that reduce the chosen training objective. A model may be expressive enough even when a particular training run fails to find a good setting.',
    'Training objective  ·  minimize L(θ)',
    'The lecture connects optimization with backpropagation to compute gradients and gradient descent to use them.',
    [q('The same architecture attains much lower training loss after a learning-rate change. Which issue did the change directly address?',
      ['The number of input features','The definition of generalization','The train/validation split','Optimization'],3,
      'The architecture stayed the same. The learning-rate change improved how training searched for a low-loss parameter setting.')]),
  l('generalization','Generalization','grid','8',
    'Generalization is performance on observations outside the data used to fit the model. An evaluation on held-out observations estimates how well the learned predictor transfers.',
    'Fit on training data  ·  evaluate on held-out data',
    'The lecture distinguishes validation on unseen observations from expressivity and obtaining a low training loss.',
    [q('A signal model fits its training window well. Which check directly examines generalization?',
      ['Evaluate it on a later time period held out from fitting','Report the training loss again','Count its parameters','Take one more gradient step'],0,
      'A held-out period contains observations the fit did not use. Its performance gives evidence about transfer to unseen data.')]),
  l('approximation','Width, depth, and approximation','curve','7–9',
    'Width adds units per layer. Depth adds layers that compose features. Comparing fitted curves can illustrate approximation differences, but results also depend on the target, data, and training procedure.',
    'Width = units per layer  ·  depth = stacked layers',
    'For a synthetic two-frequency sine target, the lecture reports grid RMSEs of 0.577, 0.107, and 0.021 for width 2 with one hidden layer, width 8 with one, and width 8 with three, respectively.',
    [q('Model A uses hidden sizes [6, 6]. Model B uses [12, 12]. What changed?',
      ['Depth increased','Both depth and width decreased','Width increased with the same hidden depth','The number of outputs doubled'],2,
      'Both architectures have two hidden layers. Each layer in Model B contains twice as many hidden units.')])
];
const forward = [
  l('xor-features','Solving XOR with hidden features','xor','10–11',
    'Opposing ReLU features capture positive and negative differences separately. Adding them gives |x₁ − x₂|, which distinguishes equal from unequal binary inputs.',
    'z = ReLU(x₁ − x₂) + ReLU(x₂ − x₁) − 0.5',
    'With the hand-chosen network, equal binary pairs give z = −0.5 and unequal pairs give z = +0.5. A sigmoid threshold of 0.5 then yields XOR.',
    [q('Use the same two difference features but set the output bias to −1.5. What happens to the binary inputs at a probability threshold of 0.5?',
      ['Every input is positive','Only the equal pairs are positive','The XOR labels are unchanged','Every input is negative'],3,
      'The hidden-feature sum can only be 0 or 1 for binary inputs. Subtracting 1.5 makes every logit negative.')]),
  l('dimensions','Parameters and dimensions','grid','10, 12',
    'With d input coordinates and H hidden units, the first weight matrix has H rows and d columns. A scalar output adds H output weights and one output bias.',
    'Parameters = Hd + H + H + 1  ·  scalar output',
    'The lecture’s 2 → 2 → 1 model has four hidden weights, two hidden biases, two output weights, and one output bias.',
    [q('How many trainable scalars are in a dense 3 → 4 → 1 model with biases?',
      ['17','21','19','24'],1,'Count 12 first-layer weights, 4 hidden biases, 4 output weights, and 1 output bias. The total is 21.')]),
  l('dag','The forward computation graph','network','13–14, 20, 22, 42',
    'A feedforward network is a directed acyclic graph. Compute nodes after their dependencies and save the intermediates used in backpropagation. The label enters the graph at the loss.',
    'x → a → h → z → p → L  ·  y → L',
    'At x = (1,0) and y = 1, the lecture gets a = h = (1,0.5), z = 0.5, p ≈ 0.6225, and L ≈ 0.4741. At the checkpoint x = (0,1), the same weights yield a = (0.2,−0.3), h = (0.2,0), and p ≈ 0.5498.',
    [q('You correct the label on a record while keeping its features and model parameters fixed. What stays the same?',
      ['The prediction and all pre-loss nodes','Only the loss','The loss and all gradients','Only the output bias gradient'],0,
      'The label first enters at L. The hidden scores, activations, logit, and probability can all be reused.'),
     q('Which quantity must be available before computing p = σ(z)?',
      ['The true label','The loss','The logit z','The updated weight gradient'],2,
      'The logit is the input to sigmoid. Loss and gradients are computed after the probability is available.')]),
  l('hidden-score','Hidden preactivations','grid','14–16',
    'The hidden preactivation vector is a matrix-vector product plus bias. Each row supplies the weights for one hidden unit. A zero input coordinate removes that column’s contribution for that observation.',
    'a = Wx + b',
    'With W = [[1, 0.2], [0.5, −0.3]], x = (1, 0), and b = (0, 0), the hidden scores are (1, 0.5). The second column has no effect on that pass.',
    [q('Let W = [[1, −2], [3, 1]], x = (2, 1), and b = (1, −1). What is a?',
      ['(0, 7)','(1, 8)','(3, 6)','(1, 6)'],3,
      'The first row gives 2 − 2 + 1 = 1. The second gives 6 + 1 − 1 = 6.')]),
  l('logit','The output logit','line','17–18',
    'The output layer takes a weighted sum of the hidden features and adds the output bias. The resulting logit can be any real number and is the input to the output sigmoid.',
    'z = vᵀh + c',
    'The lecture combines h = (1, 0.5), v = (1, −1), and c = 0 to get z = 0.5.',
    [q('For h = (2, 3), v = (−1, 2), and c = −2, what is the logit?',
      ['−2','2','4','6'],1,'The hidden features contribute −2 and +6. Adding the bias of −2 gives z = 2.')]),
  l('bce','Binary cross-entropy','target','19–20',
    'Binary cross-entropy is the negative log probability assigned to the true label. The loss uses p for a positive label and 1 − p for a negative label. Confident errors are penalized heavily.',
    'L(p, y) = −y ln(p) − (1 − y) ln(1 − p)',

const app = document.getElementById('app');
const saveStatus = document.getElementById('save-status');
const storageKey = 'keypath-learning-arcade-v1';
let storageAvailable = true;
let saves = {};
let active = {};

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(saves));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
  saveStatus.classList.toggle('warn', !storageAvailable);
  saveStatus.textContent = storageAvailable ? 'Offline · Local autosave' : 'Offline · Browser storage unavailable';
}

try {
  const previous = JSON.parse(localStorage.getItem(storageKey));
  if (previous && typeof previous === 'object' && !Array.isArray(previous)) saves = previous;
} catch {
  storageAvailable = false;
}
if (storageAvailable) persist();
else {
  saveStatus.classList.add('warn');
  saveStatus.textContent = 'Offline · Browser storage unavailable';
}

const esc = value => String(value).replace(/[&<>"']/g, character =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);
const icon = (name, small = false) =>
  `<svg aria-hidden="true" class="icon${small ? ' sm' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${icons[name] || icons.map}</svg>`;
document.getElementById('brand-icon').innerHTML = icon('key');

const mapPath = (course,map) => `#map/${course.id}/${map.id}`;
const lessonPath = (course,map,level) => `${mapPath(course,map)}/lesson/${level.id}`;
const assessmentPath = (course,map) => `${mapPath(course,map)}/assessment`;
const levelsOf = map => map.sections.flatMap(section => section.levels);
const mapSave = (course,map) => saves[`${course.id}/${map.id}`] ??= {
  keys:[], lessons:{}, exam:{draft:[], index:0, result:null, best:null}
};
const pad = value => String(value).padStart(2,'0');
const allCleared = (map,save) => levelsOf(map).every(level => save.keys.includes(level.id));
const keyCount = (map,save) => levelsOf(map).filter(level => save.keys.includes(level.id)).length;

function art(glyph = 'network') {
  return `<svg class="hero-art" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><pattern id="dots-${glyph}" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="currentColor" opacity=".24"/></pattern></defs>
    <rect width="480" height="300" fill="url(#dots-${glyph})"/>
    <g fill="none" stroke="currentColor"><circle cx="330" cy="150" r="116" opacity=".18"/><circle cx="330" cy="150" r="88" opacity=".18"/>
    <path d="M28 144H112L182 75H240l72 76h62l68-77h50m-464 70h84l72 73h56l72-66 64 68h115m-358-75h63l46 42h37l57-36h62l63 39h52M238 74v143M376 150v69" opacity=".42" stroke-width="1.2"/>
    <path d="M112 144l72 73h56l72-66h62l68-77" opacity=".8" stroke-width="2"/>
    <g fill="#183a2d" stroke-width="2"><circle cx="112" cy="144" r="6"/><circle cx="182" cy="75" r="6"/><circle cx="184" cy="217" r="6"/><circle cx="240" cy="75" r="6"/><circle cx="240" cy="217" r="6"/><circle cx="376" cy="219" r="6"/><circle cx="442" cy="74" r="6"/><circle cx="312" cy="151" r="11"/><circle cx="374" cy="151" r="6"/></g></g>
    <circle cx="312" cy="151" r="4" fill="currentColor"/><circle cx="442" cy="74" r="2" fill="currentColor"/>
  </svg>`;
}

function doorArt(earned) {
  return `<svg class="door" viewBox="0 0 156 195" aria-hidden="true">
    <path d="M8 177h140" stroke="#9ccca2" opacity=".4"/>
    <path d="M27 176V72a51 51 0 1 1 102 0v104Z" fill="#2a5040" stroke="#8bb899" stroke-width="2"/>
    <path d="M37 175V72a41 41 0 1 1 82 0v103Z" fill="${earned ? '#456a49' : '#172f26'}" stroke="#6da181"/>
    <path d="M45 167V74a33 33 0 0 1 66 0v93Z" fill="none" stroke="#527f62" stroke-dasharray="3 4"/>
    <path d="M49 153h58m-58 5h58" stroke="#537f64"/>
    <circle cx="78" cy="101" r="21" fill="${earned ? '#c9f477' : '#365947'}" stroke="#a9d09c"/>
    <svg x="66" y="89" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${earned ? '#183a2d' : '#d1efbf'}" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${icons[earned ? 'key' : 'lock']}</svg>
  </svg>`;
}

function crumb(items) {
  return `<nav class="crumbs" aria-label="Breadcrumb">${items.map(([label,href]) =>
    href ? `<a href="${href}">${esc(label)}</a><span aria-hidden="true">/</span>` :
      `<span aria-current="page">${esc(label)}</span>`).join('')}</nav>`;
}

function progress(map,save) {
  const completed = keyCount(map,save);
  const total = levelsOf(map).length;
  return `<div class="progress-block"><div class="progress-label"><span>Concept keys</span><span>${completed} / ${total}</span></div>
    <progress aria-label="Concept keys collected" value="${completed}" max="${total}"></progress></div>`;
}

function hero(kicker,title,description,extra = '',large = false) {
  return `<section class="hero${large ? ' large' : ''}">${art()}<div class="hero-content">
    <span class="eyebrow">${esc(kicker)}</span><h1>${esc(title)}</h1><p>${esc(description)}</p>${extra}</div></section>`;
}

function library() {
  return hero('The learning arcade','Unlock what you learn.','Pick a course, work through its maps, and earn a key for every concept you master.', '', true) +
    `<div class="section-title"><h2>Course Library</h2><span class="muted small">${courses.length} courses</span></div>
    <div class="grid">${courses.map(course => `<a class="card course-card" href="${coursePath(course)}">
      <span class="badge ${course.theme}">${icon(course.glyph)}</span>
      <h3>${esc(course.title)}</h3><p class="muted small">${esc(course.description)}</p>
      <span class="card-footer">${course.maps.length} ${course.maps.length === 1 ? 'map' : 'maps'} ${icon('arrow',true)}</span></a>`).join('')}</div>`;
}

function coursePage(course) {
  const cards = course.maps.map(map => {
    const save = mapSave(course,map);
    const status = save.exam.best >= 85 ? 'Map passed' : allCleared(map,save) ? 'Assessment unlocked' : keyCount(map,save) ? 'In progress' : 'Ready to start';
    return `<article class="card map-card"><span class="badge ${course.theme}">${icon('network')}</span>
      <div class="map-copy"><span class="eyebrow">${esc(map.tag)}</span><h3>${esc(map.title)}</h3><p class="small muted">${esc(map.description)}</p></div>
      <div class="map-progress"><span class="pill">${esc(status)}</span>${progress(map,save)}</div>
      <a class="button outline" href="${mapPath(course,map)}">Open Map ${icon('arrow',true)}</a></article>`;
  }).join('');
  return crumb([['Course Library','#library'],[course.title]]) +
    hero('Course collection',course.title,course.description) +
    `<div class="section-title"><h2>Learning Maps</h2><span class="muted small">${course.maps.length} ${course.maps.length === 1 ? 'map' : 'maps'}</span></div>` +
    (cards || `<section class="card empty"><span class="badge ${course.theme}">${icon('map')}</span><h3>No maps yet</h3><p class="muted">Maps for this course will appear here when course material is added.</p></section>`);
}

function stage(course,map,level,index,save,firstLocked) {
  const earned = save.keys.includes(level.id);
  const current = index === firstLocked;
  const available = earned || current;
  const tag = available ? 'a' : 'div';
  const state = earned ? 'Key earned' : current ? 'Unlocked' : 'Locked';
  return `<${tag} class="stage ${earned ? 'earned' : current ? 'current' : 'locked'}"${available ? ` href="${lessonPath(course,map,level)}"` : ''}>
    <span class="badge">${icon(level.glyph,true)}</span>
    <span class="stage-copy"><small>Level ${pad(index + 1)} · ${state}</small><strong>${esc(level.title)}</strong></span>
    ${icon(earned ? 'key' : current ? 'arrow' : 'lock',true)}</${tag}>`;
}

function mapPage(course,map,save) {
  const levels = levelsOf(map);
  const firstLocked = levels.findIndex(level => !save.keys.includes(level.id));
  const ready = firstLocked < 0;
  const next = ready ? assessmentPath(course,map) : lessonPath(course,map,levels[firstLocked]);
  const label = ready ? (save.exam.result ? 'View Assessment' : 'Open Assessment') : keyCount(map,save) ? 'Continue Learning' : 'Start Map';
  const extra = progress(map,save) + `<a class="button light" href="${next}">${label} ${icon('arrow',true)}</a>`;
  let index = 0;
  return crumb([['Course Library','#library'],[course.title,coursePath(course)],[map.title]]) +
    hero(map.tag + ' · Learning map',map.title,map.description,extra) +
    map.sections.map((section,i) => `<section><div class="section-title"><h2>${pad(i+1)} · ${esc(section.title)}</h2>
      <span class="muted small">${section.levels.length} levels</span></div>
      <div class="stage-grid">${section.levels.map(level => stage(course,map,level,index++,save,firstLocked)).join('')}</div></section>`).join('') +
    `<section class="card assessment-banner"><span class="badge">${icon(ready ? 'flag' : 'lock')}</span>
      <div style="flex:1 1 260px"><h3>Final Assessment</h3><p class="small muted">20 questions · 100 points · Pass at 85</p>
      ${save.exam.best === null ? '' : `<p class="small">Best score ${save.exam.best}/100${save.exam.best >= 85 ? ' · Map passed' : ''}</p>`}</div>
      ${ready ? `<a class="button" href="${assessmentPath(course,map)}">Open Assessment ${icon('arrow',true)}</a>` :
        '<span class="pill locked">Unlock with all concept keys</span>'}</section>
    <p class="small muted">Source · ${esc(map.source)}</p>`;
}

function options(item,selected = null,disabled = false) {
  return `<fieldset${disabled ? ' disabled' : ''}><legend tabindex="-1">${esc(item.prompt)}</legend>
    ${item.options.map((choice,i) => `<label class="option"><input type="radio" name="option" value="${i}"${selected === i ? ' checked' : ''} required>
      <span>${esc(choice)}</span></label>`).join('')}</fieldset>`;
}

function levelPage(course,map,save,level) {
  const levels = levelsOf(map);
  const index = levels.indexOf(level);
  const attempt = save.lessons[level.id] ??= {answers:[], feedback:null};
  const earned = save.keys.includes(level.id);
  const next = levels[index+1] ? lessonPath(course,map,levels[index+1]) : assessmentPath(course,map);
  const feedback = attempt.feedback;
  const figure = lectureFigures[level.id];
  const currentQuestion = feedback?.question ?? attempt.answers.length;
  const item = level.questions[currentQuestion];
  let quiz;
  if (feedback && item) {
    const correct = feedback.option === item.answer;
    quiz = options(item,feedback.option,true) +
      `<div class="feedback${correct ? '' : ' wrong'}" tabindex="-1" id="practice-feedback">
        <strong>${correct ? (earned ? 'Correct · Key earned' : 'Correct') : 'Try again'}</strong>
        <p>${esc(item.explanation)}</p></div><div class="button-row">
        ${correct && earned ? `<a class="button" href="${next}">${icon('key',true)} Open Door</a>` :
          `<button type="button" class="button" data-action="practice-continue">${correct ? 'Next Question' : 'Retry Question'}</button>`}</div>`;
  } else if (earned) {
    quiz = `<h2>Key earned</h2><p class="muted">All practice questions for this concept are complete.</p>
      <div class="button-row"><a class="button" href="${next}">${icon('key',true)} Open Door</a></div>`;
  } else {
    quiz = `<form id="practice-form">${options(item)}<div class="button-row"><button class="button" type="submit">Check Answer</button></div></form>`;
  }
  return crumb([['Course Library','#library'],[course.title,coursePath(course)],[map.title,mapPath(course,map)],[level.title]]) +
    `<div class="lesson-heading"><span class="eyebrow">Concept level ${pad(index+1)} of ${levels.length}</span><h1>${esc(level.title)}</h1></div>
    <div class="lesson-layout">
      <section class="card lesson-copy"><span class="eyebrow">The concept</span>
        <p>${esc(level.concept)}</p><div class="formula">${esc(level.formula)}</div>
        ${level.example ? `<div class="example"><span class="eyebrow">From the lecture · PDF ${/[,–]/.test(level.pages) ? 'pages' : 'page'} ${esc(level.pages)}</span>
          <p>${esc(level.example)}</p></div>` : ''}
        ${figure ? `<details class="lecture-figure"><summary>View lecture figure · PDF page ${figure.page}</summary>
          <img src="${figure.image}" alt="Original lecture slide for ${esc(level.title)}" loading="lazy"></details>` : ''}</section>
      <aside class="card door-panel"><div class="door-visual">${art(level.glyph)}
        <svg class="door-emblem" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".65">${icons[level.glyph]}</svg>${doorArt(earned)}</div>
        <div class="door-copy"><span class="pill ${earned ? 'active' : 'locked'}">${icon(earned ? 'key' : 'lock',true)} ${earned ? 'Key earned' : 'Door locked'}</span>
        <h3>${esc(level.title)} Door</h3><p class="small">${earned ? 'Your key opens the path ahead.' : 'Answer every practice question correctly to collect the key.'}</p></div></aside>
      <section class="card quiz-card"><span class="eyebrow">${item ? `Practice · Question ${currentQuestion+1} of ${level.questions.length}` : 'Practice complete'}</span>${quiz}</section>
    </div>`;
}

function assessmentPage(course,map,save) {
  const exam = save.exam;
  const items = map.assessment;
  const draftCount = exam.draft.filter(Number.isInteger).length;
  const intro = crumb([['Course Library','#library'],[course.title,coursePath(course)],[map.title,mapPath(course,map)],['Final Assessment']]) +
    `<div class="assessment-heading"><span class="eyebrow">${esc(map.title)}</span><h1>Final Assessment</h1>
      <p class="muted">20 questions · 5 points each · 85 points to pass</p></div>`;
  if (exam.result) {
    const {score, answers} = exam.result;
    return intro + `<section class="card results"><div class="score"><strong>${score}/100</strong>
      <span class="pill${score >= 85 ? ' active' : ' locked'}">${score >= 85 ? 'Map passed' : 'Below passing score'}</span></div>
      <p>${score/5} of 20 correct · Best score ${exam.best}/100</p>
      <div class="button-row"><a class="button" href="${mapPath(course,map)}">Back to Map</a>
        <button type="button" class="button outline" data-action="exam-retry">Retake Assessment</button></div>
      <div class="section-title"><h2>Answer Review</h2></div>
      ${items.map((item,i) => {
        const correct = answers[i] === item.answer;
        return `<details${correct ? '' : ' open'}><summary>${pad(i+1)} · ${correct ? 'Correct' : 'Incorrect'} · ${esc(item.prompt)}</summary>
          <div class="review-answer"><p><strong>Your answer</strong> · ${esc(item.options[answers[i]])}</p>
          <p><strong>Correct answer</strong> · ${esc(item.options[item.answer])}</p><p>${esc(item.explanation)}</p></div></details>`;
      }).join('')}</section>`;
  }
  const index = exam.index;
  return intro + `<section class="card assessment-card"><div class="progress-label"><span>Question ${index+1} of ${items.length}</span>
    <span id="draft-count">${draftCount} / ${items.length} answered</span></div>
    <progress id="exam-progress" aria-label="Questions answered" value="${draftCount}" max="${items.length}"></progress>
    <nav class="exam-nav" aria-label="Assessment questions">${items.map((_,i) =>
      `<button type="button" data-action="exam-jump" data-index="${i}" class="${Number.isInteger(exam.draft[i]) ? 'done' : ''}"
        aria-label="Question ${i+1}${Number.isInteger(exam.draft[i]) ? ', answered' : ''}"${i === index ? ' aria-current="step"' : ''}>${pad(i+1)}</button>`).join('')}</nav>
    <div id="exam-options">${options(items[index],exam.draft[index])}</div>
    <div class="button-row">
      <button type="button" class="button outline" data-action="exam-jump" data-index="${index-1}"${index === 0 ? ' disabled' : ''}>Previous</button>
      <button type="button" class="button outline" data-action="exam-jump" data-index="${index+1}"${index === items.length-1 ? ' disabled' : ''}>Next</button>
      <button type="button" class="button" data-action="exam-submit"${draftCount !== items.length ? ' disabled' : ''}>Submit Assessment</button>
    </div></section>`;
}

function render(focus = '') {
  const [view, courseId, mapId, mode, levelId] = location.hash.slice(1).split('/');
  const course = courses.find(entry => entry.id === courseId);
  const map = course?.maps.find(entry => entry.id === mapId);
  active = {};
  if (view === 'course' && course) {
    app.innerHTML = coursePage(course);
  } else if (view === 'map' && map) {
    const save = mapSave(course,map);
    const levels = levelsOf(map);
    const index = levels.findIndex(entry => entry.id === levelId);
    const level = levels[index];
    const isUnlocked = level && (index === 0 || save.keys.includes(levels[index-1].id));
    if (mode === 'lesson' && isUnlocked) {
      active = {course,map,save,level};
      app.innerHTML = levelPage(course,map,save,level);
    } else if (mode === 'assessment' && allCleared(map,save)) {
      active = {course,map,save,assessment:true};
      app.innerHTML = assessmentPage(course,map,save);
    } else {
      app.innerHTML = mapPage(course,map,save);
    }
  } else {
    app.innerHTML = library();
  }

  const heading = app.querySelector('h1');
  document.title = `${heading.textContent} · Keypath`;
  if (focus === 'page') {
    window.scrollTo(0,0);
    heading.tabIndex = -1;
    heading.focus({preventScroll:true});
  } else if (focus) {
    app.querySelector(focus)?.focus();
  }
}

app.addEventListener('submit', event => {
  if (event.target.id !== 'practice-form' || !active.level) return;
  event.preventDefault();
  const {level,save} = active;
  const attempt = save.lessons[level.id];
  const index = attempt.answers.length;
  const item = level.questions[index];
  const selected = new FormData(event.target).get('option');
  if (!item || selected === null || attempt.feedback) return;
  const option = Number(selected);
  attempt.feedback = {question:index, option};
  if (option === item.answer) {
    attempt.answers.push(option);
    if (attempt.answers.length === level.questions.length && !save.keys.includes(level.id)) save.keys.push(level.id);
  }
  persist();
  render('#practice-feedback');
});

app.addEventListener('change', event => {
  if (!active.assessment || !event.target.matches('#exam-options input[name="option"]')) return;
  const {map,save} = active;
  const exam = save.exam;
  exam.draft[exam.index] = Number(event.target.value);
  const count = exam.draft.filter(Number.isInteger).length;
  const navButton = app.querySelector(`[data-action="exam-jump"][data-index="${exam.index}"]`);
  navButton.classList.add('done');
  navButton.setAttribute('aria-label',`Question ${exam.index+1}, answered`);
  app.querySelector('#draft-count').textContent = `${count} / ${map.assessment.length} answered`;
  app.querySelector('#exam-progress').value = count;
  app.querySelector('[data-action="exam-submit"]').disabled = count !== map.assessment.length;
  persist();
});

app.addEventListener('click', event => {
  const control = event.target.closest('[data-action]');
  if (!control || control.disabled || !active.save) return;
  const {map,save,level,assessment} = active;
  const exam = save.exam;
  switch (control.dataset.action) {
    case 'practice-continue':
      if (!level) return;
      save.lessons[level.id].feedback = null;
      persist();
      render('.quiz-card legend');
      break;
    case 'exam-jump': {
      if (!assessment || exam.result) return;
      const index = Number(control.dataset.index);
      if (!Number.isInteger(index) || index < 0 || index >= map.assessment.length) return;
      exam.index = index;
      persist();
      render('.assessment-card legend');
      break;
    }
    case 'exam-submit': {
      if (!assessment || exam.result || exam.draft.filter(Number.isInteger).length !== map.assessment.length) return;
      const score = map.assessment.reduce((sum,item,i) => sum + (item.answer === exam.draft[i] ? 5 : 0),0);
      exam.result = {score, answers:exam.draft.slice()};
      exam.best = Math.max(exam.best ?? 0,score);
      persist();
      render('page');
      break;
    }
    case 'exam-retry':
      if (!assessment || !exam.result) return;
      exam.draft = [];
      exam.result = null;
      exam.index = 0;
      persist();
      render('.assessment-card legend');
      break;
  }
});

window.addEventListener('hashchange', () => render('page'));
render();
</script>
</body>
</html>
